<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ellen Horikawa のポートフォリオサイトです。"
    />
    <title>Ellen Horikawa</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1e293b;
        background: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 7vw, 4.5rem);
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 12px 35px rgb(15 23 42 / 10%);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.5rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 1.25rem 0 0;
        font-size: 1.1rem;
        line-height: 1.8;
        color: #475569;
      }

      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.75rem 1.1rem;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ellen Horikawa</h1>
      <p>
        Welcome to my website.<br />
        制作物や活動について、少しずつ紹介していきます。
      </p>
      <a href="mailto:hello@example.com">Contact</a>
    </main>
  </body>
</html>
